[package]
name = "bee-node"
version = "0.1.0"
edition = "2021"
description = "Bee Network observation node - runs on user machines to serve AI agent requests"
license = "MIT"

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full", "macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
# Use local crate for CKB hashing
bees-network-core = { path = "../bees-network-core" }
ckb-hash = "0.103"
hex = "0.4"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "5.0"
keyring = "2.1"
uuid = { version = "1.8", features = ["serde", "v4", "v7"] }
url = "2.5"
clap = { version = "4.5", features = ["derive"] }
secp256k1 = { version = "0.28", features = ["rand", "recovery"] }
chrono = { version = "0.4", features = ["serde"] }
trust-dns-resolver = { version = "0.23", features = ["tokio-runtime"] }
rustls = { version = "0.23", features = [] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.21", features = ["__rustls-tls"] }
futures-util = "0.3"
dashmap = "5.0"
bech32 = "0.11"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
desktop = ["tauri", "tauri-plugin-shell", "tauri-plugin-updater", "tauri-plugin-autostart", "tauri/macos-private-api", "tauri/custom-protocol", "tauri/tray-icon"]
