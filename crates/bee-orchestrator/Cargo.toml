[package]
name = "bee-orchestrator"
version = "0.1.0"
edition = "2021"
description = "Bee Network task orchestrator - distributes observation tasks to nodes"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full", "macros"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.8", features = ["serde", "v4", "v7"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-stream = "0.1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json"] }
secp256k1 = { version = "0.28", features = ["rand", "recovery"] }
ckb-hash = "0.103"
hex = "0.4"
bees-network-core = { path = "../bees-network-core" }
futures-util = "0.3"

[build-dependencies]
tauri-build = { version = "2", optional = true }

[features]
default = ["server"]
server = []